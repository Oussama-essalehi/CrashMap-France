services:
  postgres:
    image: postgres:16
    container_name: crashmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crashmap}
      POSTGRES_USER: ${POSTGRES_USER:-crashmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crashmap} -d ${POSTGRES_DB:-crashmap}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
